<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="Todo.css" />
  </head>
  <body>
    <div class="box">
      <div id="head">
        <div class="img">
          <img
            src="https://cdn-icons-png.flaticon.com/128/2387/2387679.png"
            alt="Todo Icon"
            style="width: 80px; height: 80px"
          />
        </div>
        <div class="stuff">
          <h1>Todo List</h1>
        </div>
      </div>

      <form id="myform">
        <div class="task-row">
          <h1>Add Items</h1>
          <input type="text" id="taskInput" placeholder="Enter task here...." />
          <button id="submit">submit</button>
        </div>
        <input type="text" id="searchInput" placeholder="search your task" />
      </form>

      <div>
        <div class="items">
          <h2>Items..</h2>
          <ul id="taskList"></ul>
        </div>
      </div>
    </div>
    <script src="Todo.js"></script>
  </body>
</html>
