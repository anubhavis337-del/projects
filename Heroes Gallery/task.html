<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Courier New", Courier, monospace;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
      }
      .login-box {
        background: white;
        width: 320px;
        padding: 35px 25px;
        border-radius: 16px;
        text-align: center;
        box-shadow: 0 10px 30px #0002;
      }
      h2{
        color:#333;
        margin-bottom: 8px;
      }

      /* .login-box {
        color:#777;
        margin-bottom:25px;
        font-size: 14px;
      } */
      input{
        width: 100%;
        padding:12px;
        margin-bottom: 15px;

      }

    button{
        width:100%;
        padding:2px;
        border: none;
        border-radius: 8px;
        background: #764ba2;
        color:white;
        font-size: 16px;
        cursor:pointer


    }
    </style>

  </head>
  <body>
    <div class="login-box">
      <h2>Welcome Page</h2>
      <p>Login to continue</p>

      <form id="form">
        <input id="user" type="email" placeholder="Email address" required />
        <input id="pass" type="password" placeholder="Password" required />

        <button id="btn" type="submit">login </button>
         <p id="message"></p>
      </form>
    </div>

    <script src="task.js"></script>
  </body>
</html>
